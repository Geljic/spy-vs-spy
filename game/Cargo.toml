[package]
name = "spy-vs-spy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["wav"] }
rand = "0.9"

# Fast iteration: optimise dependencies even in debug builds
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
